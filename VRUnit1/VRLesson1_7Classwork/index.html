<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>
      <a-sphere color="yellow" position="0 1.5 0" phi-start="135" phi-length="300"  side="double" rotation="0 90 90"></a-sphere>
      <a-sphere color="black" position="0.2 2.25 0.5" phi-start="90" phi-length="180" rotation="0 90 90" scale="0.2 0.2 0.2"></a-sphere>
      <a-sphere color="black" position="0.2 2.3 -0.5" phi-start="90" phi-length="180" rotation="0 90 90" scale="0.2 0.2 0.2"></a-sphere>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
    </a-scene>
  </body>
</html>
